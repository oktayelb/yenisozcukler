{% extends "admin/change_list.html" %}

{% block object-tools %}
{{ block.super }}
{% if activity_stats %}
<div class="module activity-summary">
  <h2>Son 24 saat</h2>
  <div class="activity-summary-grid">
    {% for label, value in activity_stats %}
      <div class="activity-summary-cell">
        <span class="activity-summary-value">{{ value }}</span>
        <span class="activity-summary-label">{{ label }}</span>
      </div>
    {% endfor %}
  </div>
</div>
<style>
  .activity-summary { margin-bottom: 20px; }
  .activity-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--hairline-color);
    border-top: 1px solid var(--hairline-color);
  }
  .activity-summary-cell {
    background: var(--body-bg);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .activity-summary-value {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--body-fg);
  }
  .activity-summary-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--body-quiet-color);
  }
</style>
{% endif %}
{% endblock %}
